<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자취루틴">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F1F3EE">
<meta name="mobile-web-app-capable" content="yes">
<link id="appleTouchIconLink" rel="apple-touch-icon">
<link id="manifestLink" rel="manifest">
<title>자취 루틴</title>
<script>
(function setupPwaIconAndManifest(){
  function drawIcon(size){
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");

    const r = size * 0.22;
    ctx.fillStyle = "#4F7A6C";
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0, 0, size, size * 0.5);

    const cx = size / 2, cy = size / 2, dotR = size * 0.28;
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#4F7A6C";
    ctx.lineWidth = size * 0.055;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cx - dotR * 0.45, cy + dotR * 0.05);
    ctx.lineTo(cx - dotR * 0.1, cy + dotR * 0.4);
    ctx.lineTo(cx + dotR * 0.5, cy - dotR * 0.35);
    ctx.stroke();

    return canvas.toDataURL("image/png");
  }

  try{
    const icon180 = drawIcon(180);
    const iconLink = document.getElementById("appleTouchIconLink");
    iconLink.setAttribute("href", icon180);

    const icon192 = drawIcon(192);
    const icon512 = drawIcon(512);
    const manifest = {
      name: "자취 루틴",
      short_name: "자취루틴",
      start_url: ".",
      scope: ".",
      display: "standalone",
      orientation: "portrait",
      background_color: "#F1F3EE",
      theme_color: "#F1F3EE",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png" },
        { src: icon512, sizes: "512x512", type: "image/png" },
        { src: icon180, sizes: "180x180", type: "image/png", purpose: "any maskable" }
      ]
    };
    const manifestJson = JSON.stringify(manifest);
    let manifestHref = null;
    try{
      const blob = new Blob([manifestJson], { type: "application/manifest+json" });
      manifestHref = URL.createObjectURL(blob);
    }catch(e){
      manifestHref = "data:application/manifest+json," + encodeURIComponent(manifestJson);
    }
    document.getElementById("manifestLink").setAttribute("href", manifestHref);
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#F1F3EE;
    --surface:#FFFFFF;
    --border:#E1E6DC;
    --ink:#262A24;
    --ink-soft:#767C6E;
    --accent:#4F7A6C;
    --accent-soft:#E3ECE6;
    --green:#7FA37A;
    --green-soft:#EAF1E8;
    --amber:#C98F2E;
    --amber-soft:#FBF1DF;
    --red:#BE5548;
    --red-soft:#F8E7E4;
    --radius-card:10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 78px;

    /* 주기 리포트 전용 색상 토큰 (생리주기 앱 스타일 3단계 녹색 계열) */
    --status-normal: #22c55e;
    --status-normal-bg: #dcfce7;
    --status-long: #15803d;
    --status-long-bg: #bbf7d0;
    --status-short: #86efac;
    --status-short-bg: #f0fdf4;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  .mono{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    padding:calc(20px + var(--safe-top)) 18px calc(var(--tabbar-h) + 20px + var(--safe-bottom));
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  .app-header{ 
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom:26px; 
  }
  .eyebrow{
    margin:0 0 4px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .app-header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .menu-btn{
    border:none;
    background:var(--surface);
    border:1px solid var(--border);
    width:42px; height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
  }
  .menu-btn:active{ transform:scale(0.94); }

  /* ---------- Section shell ---------- */
  section{ margin-bottom:30px; }
  .section-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 12px 2px;
  }

  /* ---------- Daily dots (오늘 루틴) ---------- */
  .daily-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 16px 16px;
  }
  .daily-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .daily-grid .dot-item.wide{ grid-column:1 / -1; }

  .dot-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 8px 12px;
    background:var(--accent-soft);
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    min-height:104px;
    transition:transform .12s ease;
  }
  .dot-item:nth-of-type(1){ transform:rotate(-1.1deg); }
  .dot-item:nth-of-type(2){ transform:rotate(1deg); }
  .dot-item:nth-of-type(3){ transform:rotate(-0.6deg); }
  .dot-item:active{ transform:scale(0.96); }

  .dot-item .dot{
    width:38px; height:38px;
    border-radius:50%;
    background:#fff;
    border:2.5px solid var(--accent);
    position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .dot-item.done .dot{
    background:var(--accent);
    border-color:var(--accent);
  }
  .dot-item.done .dot::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:14px; height:8px;
    border-left:3px solid #fff;
    border-bottom:3px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg);
  }
  .dot-label{
    font-size:14px;
    font-weight:600;
  }
  .dot-time{
    font-size:11px;
    color:var(--ink-soft);
    min-height:14px;
  }
  .dot-item.done .dot-time{ color:var(--accent); font-weight:600; }

  @media (prefers-reduced-motion:no-preference){
    .dot-item.done .dot{ animation:stamp .22s ease-out; }
  }
  @keyframes stamp{
    0%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }

  /* ---------- Cycle section header ---------- */
  .section-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 12px 2px;
  }
  .section-title-row .section-title{ margin:0; }
  .manage-trigger{
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
  }
  .manage-trigger:active{ transform:scale(0.95); }

  /* ---------- Cycle cards (주기 관리) ---------- */
  .cycle-list{ display:flex; flex-direction:column; gap:12px; }
  .cycle-list-empty{
    background:var(--surface);
    border:1.5px dashed var(--border);
    border-radius:var(--radius-card);
    padding:24px 16px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }

  .cycle-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:14px 14px 14px 16px;
  }

  .cycle-info{ flex:1; min-width:0; }

  .cycle-name-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .cycle-name{ font-size:15px; font-weight:700; }

  .cycle-dday{
    font-size:12px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .dday-green{ color:var(--green); background:var(--green-soft); }
  .dday-amber{ color:var(--amber); background:var(--amber-soft); }
  .dday-red{ color:var(--red); background:var(--red-soft); }

  .gauge-track{
    height:8px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .gauge-fill{
    height:100%;
    border-radius:20px;
    transition:width .25s ease, background .25s ease;
  }
  .fill-green{ background:var(--green); }
  .fill-amber{ background:var(--amber); }
  .fill-red{ background:var(--red); }

  .cycle-meta{
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .complete-btn{
    flex-shrink:0;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:12px 14px;
    border-radius:10px;
    cursor:pointer;
    min-width:56px;
    transition:transform .1s ease, opacity .1s ease;
  }
  .complete-btn:active{ transform:scale(0.93); opacity:0.85; }

  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  /* ---------- 관리 모달 (바텀시트) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(38,42,36,0.42);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    opacity:0;
    transition:opacity .2s ease;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-overlay.open{ opacity:1; }

  .modal-sheet{
    width:100%;
    max-width:520px;
    background:var(--bg);
    border-radius:22px 22px 0 0;
    padding:8px 18px calc(26px + var(--safe-bottom));
    max-height:82vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(20px);
    transition:transform .22s ease;
  }
  .modal-overlay.open .modal-sheet{ transform:translateY(0); }

  .modal-handle{
    width:36px; height:4px;
    background:var(--border);
    border-radius:4px;
    margin:6px auto 16px;
  }

  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .modal-header h2{ font-size:17px; margin:0; font-weight:700; }
  .modal-close{
    border:none;
    background:var(--surface);
    width:32px; height:32px;
    border-radius:50%;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    flex-shrink:0;
  }

  .manage-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .manage-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
  }
  .manage-row-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .manage-row-name{ font-size:14px; font-weight:700; }
  .item-icon{ font-size:1em; margin-right:4px; }
  .manage-row-days{ font-size:11.5px; color:var(--ink-soft); }

  .row-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }

  .edit-btn{
    flex-shrink:0;
    border:none;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-btn:active{ transform:scale(0.95); }

  .delete-btn{
    flex-shrink:0;
    border:none;
    background:var(--red-soft);
    color:var(--red);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .delete-btn.confirm{ background:var(--red); color:#fff; }

  .manage-empty{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:18px 0;
  }

  .add-form-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 8px 2px;
  }

  .icon-picker{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
  }
  .icon-option{
    width:38px; height:38px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-option.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .icon-option:active{ transform:scale(0.9); }

  .add-form-row{ display:flex; gap:8px; margin-bottom:10px; }

  .input-text{
    flex:1;
    min-width:0;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-family:inherit;
    background:var(--surface);
    color:var(--ink);
  }
  .add-form-days{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:0 10px;
    flex-shrink:0;
  }
  .input-number{
    width:38px;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    padding:12px 0;
    text-align:center;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  .input-number::-webkit-outer-spin-button,
  .input-number::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .input-suffix{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }

  .input-text:focus, .input-number:focus{ outline:none; border-color:var(--accent); }
  .input-text.invalid, .add-form-days.invalid{ border-color:var(--red); animation:shake .3s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .add-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.98); }

  /* ---------- 하단 탭 바 ---------- */
  .tab-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:6px 0 calc(6px + var(--safe-bottom));
    z-index:60;
  }
  .tab-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    background:none;
    border:none;
    font-family:inherit;
    color:var(--ink-soft);
    font-size:11px;
    font-weight:700;
    padding:8px 0 4px;
    cursor:pointer;
  }
  .tab-btn svg{ display:block; }
  .tab-btn.active{ color:var(--accent); }

  /* ---------- 캘린더 탭 ---------- */
  .calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .calendar-header h2{ font-size:16px; font-weight:700; margin:0; }
  .month-nav{
    border:1px solid var(--border);
    background:var(--surface);
    width:34px; height:34px;
    border-radius:50%;
    font-size:16px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .month-nav:active{ transform:scale(0.92); }

  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .calendar-weekdays span{
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
  }

  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:20px;
  }
  .day-cell{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:3px;
    padding-top:6px;
    border-radius:10px;
    background:var(--surface);
    border:1.5px solid transparent;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .day-cell.outside{ visibility:hidden; pointer-events:none; }
  .day-cell.today .day-num{ color:var(--accent); font-weight:800; }
  .day-cell.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .day-num{ font-weight:600; }
  .day-icons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1px;
    min-height:13px;
    max-width:34px;
    line-height:1;
  }
  .day-icon{ font-size:10px; }
  .day-icon-more{
    font-size:8.5px;
    font-weight:800;
    color:var(--ink-soft);
    margin-left:1px;
  }

  .day-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .day-panel-header h3{ margin:0 0 12px; font-size:15px; font-weight:700; }

  .day-log-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .day-log-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .day-log-item .log-icon{ font-size:15px; margin-right:6px; }
  .day-log-item .log-label{ font-weight:700; font-size:13.5px; }
  .day-log-item .log-time{ font-size:11.5px; color:var(--ink-soft); margin-left:8px; }
  .log-delete-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:15px;
    width:28px; height:28px;
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
  }
  .log-delete-btn:active{ background:var(--red-soft); color:var(--red); }

  .day-log-empty{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:14px 0;
    margin:0 0 14px;
  }

  .add-log-trigger{
    width:100%;
    border:1.5px dashed var(--border);
    background:none;
    color:var(--accent);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .add-log-trigger:active{ transform:scale(0.98); }
  .add-log-trigger[hidden]{ display:none; }

  .add-log-form{ display:flex; flex-direction:column; gap:8px; }
  .add-log-form[hidden]{ display:none; }
  .input-select, .input-time{
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
    width:100%;
  }
  .input-select:focus, .input-time:focus{ outline:none; border-color:var(--accent); }

  /* ---------- 실행취소 스낵바 ---------- */
  .snackbar{
    position:fixed;
    left:50%;
    bottom:calc(var(--tabbar-h) + 14px + var(--safe-bottom));
    transform:translate(-50%,16px);
    background:var(--ink);
    color:#fff;
    padding:12px 14px 12px 16px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:16px;
    max-width:88%;
    opacity:0;
    pointer-events:none;

<script>
(function(){
  "use strict";

  const DAILY_ITEMS = [
    { key: "ventMorning", label: "환기 오전", icon: "🪟" },
    { key: "ventAfternoon", label: "환기 오후", icon: "🪟" },
    { key: "shower", label: "샤워", wide: true, icon: "🚿" }
  ];

  const DEFAULT_CYCLE_ITEMS = [
    { id: "pajama",  name: "잠옷 환복", cycleDays: 3,  icon: "👕" },
    { id: "laundry", name: "일반 빨래", cycleDays: 4,  icon: "🧺" },
    { id: "bedding", name: "침구 세탁", cycleDays: 14, icon: "🛏️" }
  ];

  const ICON_OPTIONS = ["🧹","🧴","🧽","🗑️","🪥","🧻","🧦","🌱","🍽️","💊","📦","🌀","👕","🧺","🛏️","🚿","🪟","✨"];
  const FALLBACK_ICON = "🔁";

  const STORAGE_KEY_CYCLE_META = "jachwi_cycle_meta_v2";
  const STORAGE_KEY_LOGS = "jachwi_logs_v1";
  const STORAGE_KEY_DAILY_OLD = "jachwi_daily_v1";
  const STORAGE_KEY_CYCLE_OLD = "jachwi_cycle_v1";

  function pad2(n){ return String(n).padStart(2, "0"); }

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function daysBetween(fromStr, toStr){
    const a = new Date(fromStr + "T00:00:00");
    const b = new Date(toStr + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function formatHeaderDate(){
    const d = new Date();
    const weekday = ["일","월","화","수","목","금","토"][d.getDay()];
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekday})`;
  }
  function nowTimeValue(){
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function formatTimeDisplay(time24){
    if(!time24) return "";
    const [hStr, mStr] = time24.split(":");
    let h = parseInt(hStr, 10);
    const ampm = h < 12 ? "오전" : "오후";
    let h12 = h % 12; if(h12 === 0) h12 = 12;
    return `${ampm} ${h12}:${mStr}`;
  }
  function parseDisplayTime(display){
    if(!display) return null;
    const m = display.match(/^(오전|오후)\s*(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    let h = parseInt(m[2], 10);
    if(m[1] === "오후" && h !== 12) h += 12;
    if(m[1] === "오전" && h === 12) h = 0;
    return `${pad2(h)}:${m[3]}`;
  }
  function formatShortDate(dateStr){
    const parts = dateStr.split("-");
    return `${parseInt(parts[1],10)}/${parseInt(parts[2],10)}`;
  }
  function ymd(y, mZeroBased, d){
    return `${y}-${pad2(mZeroBased+1)}-${pad2(d)}`;
  }
  function generateId(){
    return "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadJSON(key, fallback){
    try{
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  function saveLogs(){ saveJSON(STORAGE_KEY_LOGS, logs); }
  function saveCycleItems(){ saveJSON(STORAGE_KEY_CYCLE_META, cycleItems); }

  let cycleItems = loadJSON(STORAGE_KEY_CYCLE_META, null);
  let logs = loadJSON(STORAGE_KEY_LOGS, null);
  const isFirstRunOfLogs = (logs === null);

  if(isFirstRunOfLogs){
    logs = [];
    const todayNow = todayStr();
    const oldCycle = loadJSON(STORAGE_KEY_CYCLE_OLD, null);
    const oldDaily = loadJSON(STORAGE_KEY_DAILY_OLD, null);

    if(Array.isArray(oldCycle) && oldCycle.length){
      if(!cycleItems){
        cycleItems = oldCycle.map(it => ({ id: it.id, name: it.name, cycleDays: it.cycleDays, createdDate: it.lastDone || todayNow }));
      }
      oldCycle.forEach(it => {
        logs.push({ id: generateId(), itemType:"cycle", itemKey: it.id, label: it.name, date: it.lastDone || todayNow, time: "12:00" });
      });
    }

    if(oldDaily && oldDaily.date === todayNow && oldDaily.items){
      DAILY_ITEMS.forEach(def => {
        const st = oldDaily.items[def.key];
        if(st && st.done){
          logs.push({ id: generateId(), itemType:"daily", itemKey: def.key, label: def.label, date: todayNow, time: parseDisplayTime(st.time) || nowTimeValue() });
        }
      });
    }
  }

  if(!cycleItems || !Array.isArray(cycleItems) || cycleItems.length === 0){
    const todayNow = todayStr();
    cycleItems = DEFAULT_CYCLE_ITEMS.map(it => ({ ...it, createdDate: todayNow }));
  }
  cycleItems.forEach(it => { if(!it.createdDate) it.createdDate = todayStr(); });
  cycleItems.forEach(it => {
    if(!it.icon){
      const preset = DEFAULT_CYCLE_ITEMS.find(d => d.id === it.id);
      it.icon = preset ? preset.icon : FALLBACK_ICON;
    }
  });

  saveCycleItems();
  saveLogs();

  function getItemIcon(itemType, itemKey){
    if(itemType === "daily"){
      const def = DAILY_ITEMS.find(d => d.key === itemKey);
      return def ? def.icon : FALLBACK_ICON;
    }
    const item = cycleItems.find(c => c.id === itemKey);
    return item ? item.icon : FALLBACK_ICON;
  }
  function getLogIcon(log){
    return log.icon || getItemIcon(log.itemType, log.itemKey);
  }

  function findLog(itemType, itemKey, date){
    return logs.find(l => l.itemType === itemType && l.itemKey === itemKey && l.date === date);
  }
  function getDayLogs(date){
    return logs.filter(l => l.date === date).sort((a,b) => a.time.localeCompare(b.time));
  }
  function getLastDoneDate(itemType, itemKey){
    let latest = null;
    logs.forEach(l => {
      if(l.itemType === itemType && l.itemKey === itemKey){
        if(latest === null || l.date > latest) latest = l.date;
      }
    });
    return latest;
  }
  function upsertLog(itemType, itemKey, label, date, time, icon){
    const resolvedIcon = icon || getItemIcon(itemType, itemKey);
    const existing = findLog(itemType, itemKey, date);
    if(existing){
      existing.time = time;
      existing.label = label;
      existing.icon = resolvedIcon;
    } else {
      logs.push({ id: generateId(), itemType, itemKey, label, date, time, icon: resolvedIcon });
    }
    saveLogs();
  }

  function getCycleStatus(item){
    const today = todayStr();
    const realLastDone = getLastDoneDate("cycle", item.id);
    const baseline = realLastDone || item.createdDate || today;

    const daysSince = daysBetween(baseline, today);
    const daysLeft = item.cycleDays - daysSince;
    const percent = Math.max(0, Math.min(100, (daysSince / item.cycleDays) * 100));

    let level;
    if(daysLeft <= 0) level = "red";
    else if(percent >= 80) level = "amber";
    else level = "green";

    let ddayLabel;
    if(daysLeft > 0) ddayLabel = `D-${daysLeft}`;
    else if(daysLeft === 0) ddayLabel = "D-DAY";
    else ddayLabel = `D+${Math.abs(daysLeft)}`;

    return { daysSince, daysLeft, percent, level, ddayLabel, realLastDone };
  }

  function getSortedCycles(){
    return cycleItems
      .map(item => ({ item, status: getCycleStatus(item) }))
      .sort((a, b) => {
        const orderDiff = URGENCY_ORDER[a.status.level] - URGENCY_ORDER[b.status.level];
        if(orderDiff !== 0) return orderDiff;
        return a.status.daysLeft - b.status.daysLeft;
      });
  }

  function getCycleStatsData(item){
    const itemLogs = logs
      .filter(l => l.itemType === "cycle" && l.itemKey === item.id)
      .sort((a, b) => a.date.localeCompare(b.date));

    const totalCount = itemLogs.length;
    const latestLog = totalCount > 0 ? itemLogs[totalCount - 1] : null;

    if(totalCount < 2){
      return {
        item,
        totalCount,
        latestDate: latestLog ? latestLog.date : null,
        intervals: [],
        avgDays: null,
        statusType: "need_more",
        diff: null,
        needCount: 2 - totalCount
      };
    }

    const intervals = [];
    for(let i = 1; i < totalCount; i++){
      const diff = daysBetween(itemLogs[i-1].date, itemLogs[i].date);
      intervals.push({
        from: itemLogs[i-1].date,
        to: itemLogs[i].date,
        days: diff
      });
    }

    const sum = intervals.reduce((acc, cur) => acc + cur.days, 0);
    const avgDays = Number((sum / intervals.length).toFixed(1));
    const target = item.cycleDays;
    const diff = avgDays - target;

    let statusType = "normal";
    if(diff > 2) statusType = "long";
    else if(diff < -2) statusType = "short";

    return {
      item,
      totalCount,
      latestDate: latestLog.date,
      intervals,
      avgDays,
      statusType,
      diff
    };
  }

  function getStatusBadgeMeta(stats){
    if(stats.statusType === "need_more"){
      return {
        className: "badge-empty",
        text: `기록 필요 (${stats.needCount}회 남음)`
      };
    }
    if(stats.statusType === "normal"){
      return {
        className: "badge-normal",
        text: "적정 주기 (±2일)"
      };
    }
    if(stats.statusType === "long"){
      return {
        className: "badge-long",
        text: `주기 늘어남 (+${stats.diff > 0 ? stats.diff.toFixed(1) : ""}일)`
      };
    }
    return {
      className: "badge-short",
      text: `주기 짧아짐 (${stats.diff.toFixed(1)}일)`
    };
  }

        <div class="report-stats-grid">
          <div class="stat-col">
            <span class="stat-label">목표 주기</span>
            <span class="stat-val mono">${item.cycleDays}일</span>
          </div>
          <div class="stat-col">
            <span class="stat-label">실제 평균 주기</span>
            <span class="stat-val mono" style="color:var(--accent);">${stats.avgDays !== null ? stats.avgDays + "일" : "-"}</span>
          </div>
        </div>
        <div class="report-footer-meta">
          <span>총 <b>${stats.totalCount}회</b> 완료</span>
          <span>${stats.latestDate ? `최근 완료: ${formatShortDate(stats.latestDate)}` : "기록 없음"}</span>
        </div>
      `;

      card.addEventListener("click", () => openReportDetailModal(item.id));
      listEl.appendChild(card);
    });
  }

  /* =========================================================
     [기능 3] 상세 주기 그래프 SVG 팝업 모달
     ========================================================= */
  const reportDetailModalOverlay = document.getElementById("reportDetailModalOverlay");
  const reportDetailModalCloseBtn = document.getElementById("reportDetailModalCloseBtn");

  function openReportDetailModal(itemId){
    const item = cycleItems.find(i => i.id === itemId);
    if(!item) return;

    const stats = getCycleStatsData(item);
    document.getElementById("reportDetailModalTitle").innerHTML = `<span class="item-icon">${item.icon || FALLBACK_ICON}</span>${item.name} 분석`;

    const summaryBox = document.getElementById("reportDetailSummary");
    summaryBox.innerHTML = `
      <div>
        <div class="sum-label">목표 주기</div>
        <div class="sum-val mono">${item.cycleDays}일</div>
      </div>
      <div>
        <div class="sum-label">평균 주기</div>
        <div class="sum-val mono" style="color:var(--accent);">${stats.avgDays !== null ? stats.avgDays + "일" : "-"}</div>
      </div>
      <div>
        <div class="sum-label">총 기록</div>
        <div class="sum-val mono">${stats.totalCount}회</div>
      </div>
    `;

    const chartWrap = document.getElementById("chartSvgWrap");
    const historyList = document.getElementById("reportDetailHistory");

    if(stats.intervals.length === 0){
      chartWrap.innerHTML = `
        <div style="text-align:center; padding:36px 0; font-size:13px; color:var(--ink-soft);">
          주기 계산을 위해 최소 2회 이상의 완료 기록이 필요해요.<br>(현재 ${stats.totalCount}회 완료)
        </div>
      `;
      historyList.innerHTML = `<div class="manage-empty">이전 간격 데이터가 아직 없습니다.</div>`;
    } else {
      // 최근 최대 8개 회차 표시
      const recentIntervals = stats.intervals.slice(-8);
      chartWrap.innerHTML = renderCycleChartSvg(item.cycleDays, recentIntervals);

      historyList.innerHTML = "";
      recentIntervals.slice().reverse().forEach((inv, idx) => {
        const diffFromTarget = inv.days - item.cycleDays;
        let color = "var(--status-normal)";
        let tag = "적정";
        if(diffFromTarget > 2){ color = "var(--status-long)"; tag = `+${diffFromTarget}일`; }
        else if(diffFromTarget < -2){ color = "var(--status-short)"; tag = `${diffFromTarget}일`; }

        const row = document.createElement("div");
        row.className = "recent-history-item";
        row.innerHTML = `
          <div>
            <span class="h-date mono">${formatShortDate(inv.from)} → ${formatShortDate(inv.to)}</span>
          </div>
          <div>
            <span class="h-days mono" style="color:${color}; margin-right:6px;">${inv.days}일</span>
            <span style="font-size:11px; color:var(--ink-soft);">(${tag})</span>
          </div>
        `;
        historyList.appendChild(row);
      });
    }

    reportDetailModalOverlay.hidden = false;
    requestAnimationFrame(() => reportDetailModalOverlay.classList.add("open"));
  }

  function closeReportDetailModal(){
    reportDetailModalOverlay.classList.remove("open");
    setTimeout(() => { reportDetailModalOverlay.hidden = true; }, 220);
  }

  reportDetailModalCloseBtn.addEventListener("click", closeReportDetailModal);
  reportDetailModalOverlay.addEventListener("click", (e) => {
    if(e.target === reportDetailModalOverlay) closeReportDetailModal();
  });

  function renderCycleChartSvg(targetDays, intervals){
    const w = 320;
    const h = 170;
    const padTop = 24;
    const padBottom = 26;
    const padLeft = 24;
    const padRight = 14;

    const maxDaysVal = Math.max(targetDays * 1.4, ...intervals.map(i => i.days), 5);
    const plotH = h - padTop - padBottom;
    const plotW = w - padLeft - padRight;

    function getY(val){
      return padTop + plotH - (val / maxDaysVal) * plotH;
    }

    const targetY = getY(targetDays);
    const barCount = intervals.length;
    const colWidth = plotW / barCount;
    const barWidth = Math.min(26, colWidth * 0.55);

    let barsSvg = "";
    intervals.forEach((item, i) => {
      const x = padLeft + i * colWidth + (colWidth - barWidth) / 2;
      const barH = (item.days / maxDaysVal) * plotH;
      const y = padTop + plotH - barH;

      // 3단계 색상 판별
      let fillColor = "#22c55e"; // 적정
      if(item.days - targetDays > 2) fillColor = "#15803d"; // 길어짐
      else if(item.days - targetDays < -2) fillColor = "#86efac"; // 짧아짐

      barsSvg += `
        <g>
          <rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="4" fill="${fillColor}" />
          <text x="${x + barWidth/2}" y="${y - 6}" font-size="11" font-weight="700" fill="${fillColor}" text-anchor="middle" font-family="ui-monospace, monospace">${item.days}d</text>
          <text x="${x + barWidth/2}" y="${h - 8}" font-size="10" fill="#767C6E" text-anchor="middle">${i + 1}회</text>
        </g>
      `;
    });

    return `
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}">
        <!-- Y축 기준선 0일 -->
        <line x1="${padLeft}" y1="${padTop + plotH}" x2="${w - padRight}" y2="${padTop + plotH}" stroke="#E1E6DC" stroke-width="1.5" />
        
        <!-- 목표 주기 점선 라인 -->
        <line x1="${padLeft}" y1="${targetY}" x2="${w - padRight}" y2="${targetY}" stroke="# BE5548" stroke="#767C6E" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
        <text x="${w - padRight}" y="${targetY - 4}" font-size="10" font-weight="700" fill="#767C6E" text-anchor="end">목표 ${targetDays}일</text>

        <!-- 막대 그래프들 -->
        ${barsSvg}
      </svg>
    `;
  }

  /* =========================================================
     통합 상태 리렌더 & 자정 감지
     ========================================================= */
  function onDataChanged(){
    renderDaily();
    renderCycles();
    if(!calendarView.hidden){
      renderCalendarGrid();
      renderDayPanel(selectedDate);
    }
    if(!reportView.hidden){
      renderReportView();
    }
  }

  function renderAll(){
    renderHeader();
    renderDaily();
    renderCycles();
  }

  let lastKnownDate = todayStr();
  function checkDateChange(){
    const today = todayStr();
    if(today !== lastKnownDate){
      lastKnownDate = today;
      onDataChanged();
    }
    renderHeader();
  }
  setInterval(checkDateChange, 30 * 1000);
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") checkDateChange();
  });

  renderAll();
})();
</script>
</body>
</html>
