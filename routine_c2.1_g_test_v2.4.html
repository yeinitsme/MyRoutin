<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자취루틴">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F1F3EE">
<meta name="mobile-web-app-capable" content="yes">
<link id="appleTouchIconLink" rel="apple-touch-icon">
<link id="manifestLink" rel="manifest">
<title>자취 루틴</title>
<script>
/* =========================================================
   PWA 아이콘 + manifest.json 동적 생성 (단일 파일 유지용)
   ========================================================= */
(function setupPwaIconAndManifest(){
  function drawIcon(size){
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");

    const r = size * 0.22;
    ctx.fillStyle = "#4F7A6C";
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0, 0, size, size * 0.5);

    const cx = size / 2, cy = size / 2, dotR = size * 0.28;
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#4F7A6C";
    ctx.lineWidth = size * 0.055;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cx - dotR * 0.45, cy + dotR * 0.05);
    ctx.lineTo(cx - dotR * 0.1, cy + dotR * 0.4);
    ctx.lineTo(cx + dotR * 0.5, cy - dotR * 0.35);
    ctx.stroke();

    return canvas.toDataURL("image/png");
  }

  try{
    const icon180 = drawIcon(180);
    const iconLink = document.getElementById("appleTouchIconLink");
    iconLink.setAttribute("href", icon180);

    const icon192 = drawIcon(192);
    const icon512 = drawIcon(512);
    const manifest = {
      name: "자취 루틴",
      short_name: "자취루틴",
      start_url: ".",
      scope: ".",
      display: "standalone",
      orientation: "portrait",
      background_color: "#F1F3EE",
      theme_color: "#F1F3EE",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png" },
        { src: icon512, sizes: "512x512", type: "image/png" },
        { src: icon180, sizes: "180x180", type: "image/png", purpose: "any maskable" }
      ]
    };
    const manifestJson = JSON.stringify(manifest);
    let manifestHref = null;
    try{
      const blob = new Blob([manifestJson], { type: "application/manifest+json" });
      manifestHref = URL.createObjectURL(blob);
    }catch(e){
      manifestHref = "data:application/manifest+json," + encodeURIComponent(manifestJson);
    }
    document.getElementById("manifestLink").setAttribute("href", manifestHref);
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#F1F3EE;
    --surface:#FFFFFF;
    --border:#E1E6DC;
    --ink:#262A24;
    --ink-soft:#767C6E;
    --accent:#4F7A6C;
    --accent-soft:#E3ECE6;
    --green:#7FA37A;
    --green-soft:#EAF1E8;
    --amber:#C98F2E;
    --amber-soft:#FBF1DF;
    --red:#BE5548;
    --red-soft:#F8E7E4;
    --rpt-normal:#4C8558;
    --rpt-normal-soft:#E4EFE0;
    --rpt-slow:#1F5C4E;
    --rpt-slow-soft:#DCEAE6;
    --rpt-fast:#A9D94B;
    --rpt-fast-soft:#EFF8D2;
    --rpt-fast-ink:#5C7A1E;
    --radius-card:10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 78px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  .mono{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    padding:calc(20px + var(--safe-top)) 18px calc(var(--tabbar-h) + 20px + var(--safe-bottom));
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  .app-header{ margin-bottom:26px; }
  .eyebrow{
    margin:0 0 4px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .app-header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  /* ---------- Section shell ---------- */
  section{ margin-bottom:30px; }
  .section-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 12px 2px;
  }

  /* ---------- Daily dots (오늘 루틴) ---------- */
  .daily-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 16px 16px;
  }
  .daily-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .daily-grid .dot-item.wide{ grid-column:1 / -1; }

  .dot-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 8px 12px;
    background:var(--accent-soft);
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    min-height:104px;
    transition:transform .12s ease;
  }
  .dot-item:nth-of-type(1){ transform:rotate(-1.1deg); }
  .dot-item:nth-of-type(2){ transform:rotate(1deg); }
  .dot-item:nth-of-type(3){ transform:rotate(-0.6deg); }
  .dot-item:active{ transform:scale(0.96); }

  .dot-item .dot{
    width:38px; height:38px;
    border-radius:50%;
    background:#fff;
    border:2.5px solid var(--accent);
    position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .dot-item.done .dot{
    background:var(--accent);
    border-color:var(--accent);
  }
  .dot-item.done .dot::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:14px; height:8px;
    border-left:3px solid #fff;
    border-bottom:3px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg);
  }
  .dot-label{
    font-size:14px;
    font-weight:600;
  }
  .dot-time{
    font-size:11px;
    color:var(--ink-soft);
    min-height:14px;
  }
  .dot-item.done .dot-time{ color:var(--accent); font-weight:600; }

  /* 방금 클릭한 항목 1개에만 적용되는 바운스 애니메이션 */
  @media (prefers-reduced-motion:no-preference){
    .dot-item.animate-bounce{
      animation: cardPop 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dot-item.animate-bounce .dot{
      animation: stamp 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  }

  @keyframes cardPop{
    0%{ transform:scale(0.95); }
    50%{ transform:scale(1.03); }
    100%{ transform:scale(1); }
  }
  @keyframes stamp{
    0%{ transform:scale(0.85); }
    50%{ transform:scale(1.25); }
    100%{ transform:scale(1); }
  }

  /* ---------- Cycle section header ---------- */
  .section-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 12px 2px;
  }
  .section-title-row .section-title{ margin:0; }
  .manage-trigger{
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
  }
  .manage-trigger:active{ transform:scale(0.95); }

  /* ---------- Cycle cards (주기 관리) ---------- */
  .cycle-list{ display:flex; flex-direction:column; gap:12px; }
  .cycle-list-empty{
    background:var(--surface);
    border:1.5px dashed var(--border);
    border-radius:var(--radius-card);
    padding:24px 16px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }

  .cycle-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:14px 14px 14px 16px;
    transition:background-color .2s ease, opacity .2s ease;
  }

  .cycle-card.today-done{
    background:#FAFBFA;
    border-color:#E8ECE5;
  }

  .cycle-info{ flex:1; min-width:0; }

  .cycle-name-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .cycle-name{ font-size:15px; font-weight:700; }

  .cycle-dday{
    font-size:12px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .dday-green{ color:var(--green); background:var(--green-soft); }
  .dday-amber{ color:var(--amber); background:var(--amber-soft); }
  .dday-red{ color:var(--red); background:var(--red-soft); }
  .dday-done{ color:var(--ink-soft); background:var(--border); }

  .gauge-track{
    height:8px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .gauge-fill{
    height:100%;
    border-radius:20px;
    transition:width .25s ease, background .25s ease;
  }
  .fill-green{ background:var(--green); }
  .fill-amber{ background:var(--amber); }
  .fill-red{ background:var(--red); }

  .cycle-meta{
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .complete-btn{
    flex-shrink:0;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:12px 14px;
    border-radius:10px;
    cursor:pointer;
    min-width:56px;
    transition:transform .1s ease, opacity .1s ease, background-color .15s ease;
    user-select:none;
  }
  .complete-btn:active{ transform:scale(0.93); opacity:0.85; }

  .complete-btn.done-today-btn{
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid rgba(79,122,108,0.2);
    padding:10px 10px;
    font-size:12px;
  }
  .complete-btn.done-today-btn:active{ transform:scale(0.96); opacity:0.9; }

  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  /* ---------- 관리 모달 (바텀시트) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(38,42,36,0.42);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    opacity:0;
    transition:opacity .2s ease;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-overlay.open{ opacity:1; }

  .modal-sheet{
    width:100%;
    max-width:520px;
    background:var(--bg);
    border-radius:22px 22px 0 0;
    padding:8px 18px calc(26px + var(--safe-bottom));
    max-height:85vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(20px);
    transition:transform .22s ease;
  }
  .modal-overlay.open .modal-sheet{ transform:translateY(0); }

  .modal-handle{
    width:36px; height:4px;
    background:var(--border);
    border-radius:4px;
    margin:6px auto 16px;
  }

  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .modal-header h2{ font-size:17px; margin:0; font-weight:700; }
  .modal-close{
    border:none;
    background:var(--surface);
    width:32px; height:32px;
    border-radius:50%;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    flex-shrink:0;
  }

  .manage-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .manage-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
  }
  .manage-row-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .manage-row-name{ font-size:14px; font-weight:700; }
  .item-icon{ font-size:1em; margin-right:4px; }
  .manage-row-days{ font-size:11.5px; color:var(--ink-soft); }

  .row-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }

  .edit-btn{
    flex-shrink:0;
    border:none;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-btn:active{ transform:scale(0.95); }

  .delete-btn{
    flex-shrink:0;
    border:none;
    background:var(--red-soft);
    color:var(--red);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .delete-btn.confirm{ background:var(--red); color:#fff; }

  .manage-empty{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:18px 0;
  }

  .add-form-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 8px 2px;
  }

  .icon-picker{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
  }
  .icon-option{
    width:38px; height:38px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-option.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .icon-option:active{ transform:scale(0.9); }

  .add-form-row{ display:flex; gap:8px; margin-bottom:10px; }

  .input-text{
    flex:1;
    min-width:0;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-family:inherit;
    background:var(--surface);
    color:var(--ink);
  }
  .add-form-days{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:0 10px;
    flex-shrink:0;
  }
  .input-number{
    width:38px;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    padding:12px 0;
    text-align:center;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  .input-number::-webkit-outer-spin-button,
  .input-number::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .input-suffix{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }

  .input-text:focus, .input-number:focus{ outline:none; border-color:var(--accent); }
  .input-text.invalid, .add-form-days.invalid{ border-color:var(--red); animation:shake .3s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .add-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.98); }

  /* ---------- 공통 대화상자 (Dialog) ---------- */
  .dialog-overlay{
    position:fixed; inset:0;
    background:rgba(38,42,36,0.42);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:120;
    opacity:0;
    transition:opacity .2s ease;
  }
  .dialog-overlay[hidden]{ display:none; }
  .dialog-overlay.open{ opacity:1; }

  .dialog-card{
    width:100%;
    max-width:320px;
    background:var(--surface);
    border-radius:18px;
    padding:20px 18px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    text-align:center;
    transform:scale(0.95);
    transition:transform .2s ease;
  }
  .dialog-overlay.open .dialog-card{ transform:scale(1); }

  .dialog-title{
    margin:0 0 8px;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .dialog-desc{
    margin:0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.45;
  }
  .dialog-actions{
    display:flex;
    gap:8px;
  }
  .dialog-btn{
    flex:1;
    border:none;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .dialog-btn.cancel{
    background:var(--bg);
    color:var(--ink-soft);
  }
  .dialog-btn.danger{
    background:var(--red-soft);
    color:var(--red);
  }
  .dialog-btn:active{ transform:scale(0.96); }

  /* ---------- 헤더: 햄버거 메뉴 ---------- */
  .app-header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .hamburger-btn{
    flex-shrink:0;
    width:38px; height:38px;
    border:1.5px solid var(--border);
    background:var(--surface);
    border-radius:12px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top:2px;
  }
  .hamburger-btn:active{ transform:scale(0.92); }

  /* ---------- 사이드 드로어 ---------- */
  .drawer-overlay{
    position:fixed; inset:0;
    background:rgba(38,42,36,0.42);
    display:flex;
    justify-content:flex-end;
    z-index:110;
    opacity:0;
    transition:opacity .2s ease;
  }
  .drawer-overlay[hidden]{ display:none; }
  .drawer-overlay.open{ opacity:1; }

  .drawer-panel{
    width:78%;
    max-width:300px;
    height:100%;
    background:var(--bg);
    box-shadow:-8px 0 28px rgba(38,42,36,0.16);
    padding:calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    transform:translateX(18px);
    transition:transform .22s ease;
  }
  .drawer-overlay.open .drawer-panel{ transform:translateX(0); }

  .drawer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .drawer-header h2{ font-size:16px; font-weight:700; margin:0; }

  .drawer-menu{ display:flex; flex-direction:column; gap:8px; }
  .drawer-menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:12px;
    padding:13px 14px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .drawer-menu-item:active{ transform:scale(0.97); background:var(--accent-soft); }
  .drawer-menu-icon{ font-size:17px; line-height:1; }

  /* ---------- 주기 리포트 뷰 ---------- */
  .report-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .report-header h2{ font-size:18px; font-weight:700; margin:0; }

  .report-intro{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .report-intro-desc{
    margin:0 0 10px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .report-intro-legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
  }

  .report-list{ display:flex; flex-direction:column; gap:12px; }
  .report-list-empty{
    background:var(--surface);
    border:1.5px dashed var(--border);

  /* ---------- 주기 상세 그래프 모달 ---------- */

  .tab-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;

  /* ---------- 캘린더 탭 ---------- */

    display:flex;

    justify-content:space-between;

  .calendar-header h2{ font-size:16px; font-weight:700; margin:0; }

    border:1px solid var(--border);

  .day-log-empty{
    font-size:13px;
    color:var(--ink-soft);

  }

  .add-log-trigger{
    width:100%;
    border:1.5px dashed var(--border);

    color:var(--accent);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;

    border-radius:10px;

  .input-select, .input-time{

    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-family:inherit;

    color:var(--ink);
    width:100%;
  }
  .input-select:focus, .input-time:focus{ outline:none; border-color:var(--accent); }

  /* ---------- 실행취소 스낵바 ---------- */
  .snackbar{
    position:fixed;
    left:50%;
    bottom:calc(var(--tabbar-h) + 14px + var(--safe-bottom));
    transform:translate(-50%,16px);
    background:var(--ink);
    color:#fff;
    padding:12px 14px 12px 16px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:16px;
    max-width:88%;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .snackbar.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .snackbar-msg{ flex:1; }
  .snackbar-undo{
    border:none;
    background:none;
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    flex-shrink:0;
    padding:2px;
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">

<nav class="tab-bar">

<script>
(function(){
  "use strict";

  const DAILY_ITEMS = [
    { key: "ventMorning", label: "환기 오전", icon: "🪟" },
    { key: "ventAfternoon", label: "환기 오후", icon: "🪟" },
    { key: "shower", label: "샤워", wide: true, icon: "🚿" }
  ];

  const DEFAULT_CYCLE_ITEMS = [
    { id: "pajama",  name: "잠옷 환복", cycleDays: 3,  icon: "👕" },
    { id: "laundry", name: "일반 빨래", cycleDays: 4,  icon: "🧺" },
    { id: "bedding", name: "침구 세탁", cycleDays: 14, icon: "🛏️" }
  ];

  const ICON_OPTIONS = ["🧹","🧴","🧽","🗑️","🪥","🧻","🧦","🌱","🍽️","💊","📦","🌀","👕","🧺","🛏️","🚿","🪟","✨"];
  const FALLBACK_ICON = "🔁";

  const STORAGE_KEY_CYCLE_META = "jachwi_cycle_meta_v2";
  const STORAGE_KEY_LOGS = "jachwi_logs_v1";
  const STORAGE_KEY_DAILY_OLD = "jachwi_daily_v1";
  const STORAGE_KEY_CYCLE_OLD = "jachwi_cycle_v1";

  /* 방금 사용자가 터치한 항목 1개만 추적하는 방어 변수 */
  let lastToggledDailyKey = null;

  /* ---------- 유틸 ---------- */
  function pad2(n){ return String(n).padStart(2, "0"); }

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function daysBetween(fromStr, toStr){
    const a = new Date(fromStr + "T00:00:00");
    const b = new Date(toStr + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function formatHeaderDate(){
    const d = new Date();
    const weekday = ["일","월","화","수","목","금","토"][d.getDay()];
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekday})`;
  }
  function nowTimeValue(){
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function formatTimeDisplay(time24){
    if(!time24) return "";
    const [hStr, mStr] = time24.split(":");
    let h = parseInt(hStr, 10);
    const ampm = h < 12 ? "오전" : "오후";
    let h12 = h % 12; if(h12 === 0) h12 = 12;
    return `${ampm} ${h12}:${mStr}`;
  }
  function parseDisplayTime(display){
    if(!display) return null;
    const m = display.match(/^(오전|오후)\s*(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    let h = parseInt(m[2], 10);
    if(m[1] === "오후" && h !== 12) h += 12;
    if(m[1] === "오전" && h === 12) h = 0;
    return `${pad2(h)}:${m[3]}`;
  }
  function formatShortDate(dateStr){
    const parts = dateStr.split("-");
    return `${parseInt(parts[1],10)}/${parseInt(parts[2],10)}`;
  }
  function ymd(y, mZeroBased, d){
    return `${y}-${pad2(mZeroBased+1)}-${pad2(d)}`;
  }
  function generateId(){
    return "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- 저장소 ---------- */
  function loadJSON(key, fallback){
    try{
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  function saveLogs(){ saveJSON(STORAGE_KEY_LOGS, logs); }
  function saveCycleItems(){ saveJSON(STORAGE_KEY_CYCLE_META, cycleItems); }

  /* ---------- 초기 로드 + 마이그레이션 ---------- */
  let cycleItems = loadJSON(STORAGE_KEY_CYCLE_META, null);
  let logs = loadJSON(STORAGE_KEY_LOGS, null);
  const isFirstRunOfLogs = (logs === null);

  if(isFirstRunOfLogs){
    logs = [];
    const todayNow = todayStr();
    const oldCycle = loadJSON(STORAGE_KEY_CYCLE_OLD, null);
    const oldDaily = loadJSON(STORAGE_KEY_DAILY_OLD, null);

    if(Array.isArray(oldCycle) && oldCycle.length){
      if(!cycleItems){
        cycleItems = oldCycle.map(it => ({ id: it.id, name: it.name, cycleDays: it.cycleDays, createdDate: it.lastDone || todayNow }));
      }
      oldCycle.forEach(it => {
        logs.push({ id: generateId(), itemType:"cycle", itemKey: it.id, label: it.name, date: it.lastDone || todayNow, time: "12:00" });
      });
    }

    if(oldDaily && oldDaily.date === todayNow && oldDaily.items){
      DAILY_ITEMS.forEach(def => {
        const st = oldDaily.items[def.key];
        if(st && st.done){
          logs.push({ id: generateId(), itemType:"daily", itemKey: def.key, label: def.label, date: todayNow, time: parseDisplayTime(st.time) || nowTimeValue() });
        }
      });
    }
  }

  if(!cycleItems || !Array.isArray(cycleItems) || cycleItems.length === 0){
    const todayNow = todayStr();
    cycleItems = DEFAULT_CYCLE_ITEMS.map(it => ({ ...it, createdDate: todayNow }));
  }
  cycleItems.forEach(it => { if(!it.createdDate) it.createdDate = todayStr(); });
  cycleItems.forEach(it => {
    if(!it.icon){
      const preset = DEFAULT_CYCLE_ITEMS.find(d => d.id === it.id);
      it.icon = preset ? preset.icon : FALLBACK_ICON;
    }
  });

  saveCycleItems();
  saveLogs();

  /* ---------- 아이콘 조회 ---------- */
  function getItemIcon(itemType, itemKey){
    if(itemType === "daily"){
      const def = DAILY_ITEMS.find(d => d.key === itemKey);
      return def ? def.icon : FALLBACK_ICON;
    }
    const item = cycleItems.find(c => c.id === itemKey);
    return item ? item.icon : FALLBACK_ICON;
  }
  function getLogIcon(log){
    return log.icon || getItemIcon(log.itemType, log.itemKey);
  }

  /* ---------- 로그 CRUD ---------- */
  function findLog(itemType, itemKey, date){
    return logs.find(l => l.itemType === itemType && l.itemKey === itemKey && l.date === date);
  }
  function getDayLogs(date){
    return logs.filter(l => l.date === date).sort((a,b) => a.time.localeCompare(b.time));
  }
  function getLastDoneDate(itemType, itemKey){
    let latest = null;
    logs.forEach(l => {
      if(l.itemType === itemType && l.itemKey === itemKey){
        if(latest === null || l.date > latest) latest = l.date;
      }
    });
    return latest;
  }
  function upsertLog(itemType, itemKey, label, date, time, icon){
    const resolvedIcon = icon || getItemIcon(itemType, itemKey);
    const existing = findLog(itemType, itemKey, date);
    if(existing){
      existing.time = time;
      existing.label = label;
      existing.icon = resolvedIcon;
    } else {
      logs.push({ id: generateId(), itemType, itemKey, label, date, time, icon: resolvedIcon });
    }
    saveLogs();
  }
  function removeLogById(id){
    logs = logs.filter(l => l.id !== id);
    saveLogs();
  }

  /* =========================================================
     대시보드 — 오늘 루틴
     ========================================================= */
  function renderHeader(){
    document.getElementById("todayDate").textContent = formatHeaderDate();
  }

  function renderDaily(){
    const grid = document.getElementById("dailyGrid");
    grid.innerHTML = "";
    const today = todayStr();
    DAILY_ITEMS.forEach(def => {
      const log = findLog("daily", def.key, today);
      const done = !!log;
      const isJustToggled = (lastToggledDailyKey === def.key);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dot-item" 
        + (def.wide ? " wide" : "") 
        + (done ? " done" : "") 
        + (isJustToggled ? " animate-bounce" : "");
      btn.setAttribute("aria-pressed", done ? "true" : "false");
      btn.innerHTML = `
        <span class="dot" aria-hidden="true"></span>
        <span class="dot-label"><span class="item-icon" aria-hidden="true">${def.icon || FALLBACK_ICON}</span>${def.label}</span>
        <span class="dot-time">${done ? formatTimeDisplay(log.time) : "미완료"}</span>
      `;

      if(isJustToggled){
        btn.addEventListener("animationend", () => {
          btn.classList.remove("animate-bounce");
        }, { once: true });
      }

      btn.addEventListener("click", () => toggleDaily(def));
      grid.appendChild(btn);
    });

    // 렌더링에 1회 반영 후 플래그 초기화
    lastToggledDailyKey = null;
  }

  function toggleDaily(def){
    lastToggledDailyKey = def.key;
    const today = todayStr();
    const log = findLog("daily", def.key, today);
    if(log){
      removeLogById(log.id);
    } else {
      upsertLog("daily", def.key, def.label, today, nowTimeValue(), def.icon);
    }
    onDataChanged();
  }

  /* =========================================================
     대시보드 — 주기 관리
     ========================================================= */
  function getCycleStatus(item){
    const today = todayStr();
    const realLastDone = getLastDoneDate("cycle", item.id);
    const isDoneToday = (realLastDone === today);

    if(isDoneToday){
      return {
        daysSince: 0,
        daysLeft: item.cycleDays,
        percent: 0,
        level: "green",
        ddayLabel: `다음 예정: ${item.cycleDays}일 뒤`,
        realLastDone,
        isDoneToday: true
      };
    }

    const baseline = realLastDone || item.createdDate || today;
    const daysSince = daysBetween(baseline, today);
    const daysLeft = item.cycleDays - daysSince;
    const percent = Math.max(0, Math.min(100, (daysSince / item.cycleDays) * 100));

    let level;
    if(daysLeft <= 0) level = "red";
    else if(percent >= 80) level = "amber";
    else level = "green";

    let ddayLabel;
    if(daysLeft > 0) ddayLabel = `D-${daysLeft}`;
    else if(daysLeft === 0) ddayLabel = "D-DAY";
    else ddayLabel = `D+${Math.abs(daysLeft)}`;

    return { daysSince, daysLeft, percent, level, ddayLabel, realLastDone, isDoneToday: false };
  }

  const URGENCY_ORDER = { red: 0, amber: 1, green: 2 };
  const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function getSortedCycles(){
    return cycleItems
      .map(item => ({ item, status: getCycleStatus(item) }))
      .sort((a, b) => {
        if(a.status.isDoneToday !== b.status.isDoneToday){
          return a.status.isDoneToday ? 1 : -1;
        }
        const orderDiff = URGENCY_ORDER[a.status.level] - URGENCY_ORDER[b.status.level];
        if(orderDiff !== 0) return orderDiff;
        return a.status.daysLeft - b.status.daysLeft;
      });
  }

  function renderCycles(){
    const list = document.getElementById("cycleList");

    if(cycleItems.length === 0){
      list.innerHTML = `<div class="cycle-list-empty">등록된 항목이 없어요.<br>'관리'를 눌러 추가해보세요.</div>`;
      return;
    }

    const firstRects = {};
    if(!prefersReducedMotion){
      list.querySelectorAll(".cycle-card").forEach(card => {
        firstRects[card.dataset.id] = card.getBoundingClientRect();
      });
    }

    const sorted = getSortedCycles();
    list.innerHTML = "";
    sorted.forEach(({ item, status }) => {
      const card = document.createElement("div");
      card.className = "cycle-card" + (status.isDoneToday ? " today-done" : "");
      card.dataset.id = item.id;

      const ddayBadgeClass = status.isDoneToday ? "dday-done" : `dday-${status.level}`;
      const metaText = status.isDoneToday
        ? `오늘 완료됨 · ${item.cycleDays}일 주기`
        : (status.realLastDone ? `마지막 완료 ${formatShortDate(status.realLastDone)} · ${item.cycleDays}일 주기` : `등록 후 완료 기록 없음 · ${item.cycleDays}일 주기`);

      card.innerHTML = `
        <div class="cycle-info">
          <div class="cycle-name-row">
            <span class="cycle-name"><span class="item-icon" aria-hidden="true">${item.icon || FALLBACK_ICON}</span>${item.name}</span>
            <span class="cycle-dday mono ${ddayBadgeClass}">${status.ddayLabel}</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill fill-${status.level}" style="width:${status.percent}%"></div>
          </div>
          <div class="cycle-meta mono">${metaText}</div>
        </div>
        <button type="button" class="complete-btn ${status.isDoneToday ? "done-today-btn" : ""}" data-id="${item.id}">
          ${status.isDoneToday ? "오늘 완료됨 ✓" : "완료"}
        </button>
      `;

      const btn = card.querySelector(".complete-btn");
      if(status.isDoneToday){
        btn.addEventListener("click", () => promptUndoTodayCycle(item));
      } else {
        btn.addEventListener("click", () => completeCycle(item.id));
      }

      list.appendChild(card);
    });

    if(!prefersReducedMotion){
      list.querySelectorAll(".cycle-card").forEach(card => {
        const first = firstRects[card.dataset.id];
        if(!first) return;
        const last = card.getBoundingClientRect();
        const deltaY = first.top - last.top;
        if(deltaY){
          card.style.transition = "none";
          card.style.transform = `translateY(${deltaY}px)`;
          requestAnimationFrame(() => {
            card.style.transition = "transform .28s ease";
            card.style.transform = "";
          });
        }
      });
    }
  }

  function completeCycle(id){
    const item = cycleItems.find(i => i.id === id);
    if(!item) return;
    upsertLog("cycle", item.id, item.name, todayStr(), nowTimeValue(), item.icon);
    onDataChanged();
  }

  /* ---------- 실수 취소(Undo) 팝업 처리 ---------- */
  let itemToUndo = null;
  const undoDialogOverlay = document.getElementById("undoDialogOverlay");

  function promptUndoTodayCycle(item){
    itemToUndo = item;
    document.getElementById("undoDialogTitle").textContent = `'${item.name}' 기록을 취소할까요?`;
    document.getElementById("undoDialogDesc").textContent = "오늘 완료 기록이 삭제되고 완료 전 주기 상태로 복원됩니다.";
    undoDialogOverlay.hidden = false;
    requestAnimationFrame(() => undoDialogOverlay.classList.add("open"));
  }

  function closeUndoDialog(){
    undoDialogOverlay.classList.remove("open");
    setTimeout(() => {
      undoDialogOverlay.hidden = true;
      itemToUndo = null;
    }, 200);
  }

  document.getElementById("undoDialogCancelBtn").addEventListener("click", closeUndoDialog);
  undoDialogOverlay.addEventListener("click", (e) => {
    if(e.target.id === "undoDialogOverlay") closeUndoDialog();
  });

  document.getElementById("undoDialogConfirmBtn").addEventListener("click", () => {
    if(!itemToUndo) return;
    const today = todayStr();
    const todayLog = findLog("cycle", itemToUndo.id, today);
    if(todayLog){
      removeLogById(todayLog.id);
      onDataChanged();
      showSnackbar(`'${itemToUndo.name}'의 오늘 완료 기록을 취소했어요`, () => {
        upsertLog("cycle", itemToUndo.id, itemToUndo.name, today, todayLog.time || nowTimeValue(), itemToUndo.icon);
        onDataChanged();
      });
    }
    closeUndoDialog();
  });

  /* =========================================================
     주기 리포트
     ========================================================= */
  const CYCLE_DIFF_THRESHOLD = 2;
  const REPORT_CHART_MAX_BARS = 6;

  function getCycleCompletionDates(itemId){
    return logs
      .filter(l => l.itemType === "cycle" && l.itemKey === itemId)
      .map(l => l.date)
      .sort();
  }

  function getCycleIntervals(dates){
    const intervals = [];
    for(let i = 1; i < dates.length; i++){
      intervals.push({
        days: daysBetween(dates[i-1], dates[i]),
        startDate: dates[i-1],
        endDate: dates[i]
      });
    }
    return intervals;
  }

  function classifyCycleLevel(value, target){
    const diff = value - target;
    if(diff > CYCLE_DIFF_THRESHOLD) return "slow";
    if(diff < -CYCLE_DIFF_THRESHOLD) return "fast";
    return "normal";
  }

  const CYCLE_LEVEL_LABEL = { normal: "적정", slow: "느림", fast: "빠름" };

  function formatCycleBadgeLabel(level, avg, target){
    const diff = avg - target;
    const sign = diff >= 0 ? "+" : "";
    return `${CYCLE_LEVEL_LABEL[level]} (${sign}${diff.toFixed(1)}일)`;
  }

  function getCycleReportStats(item){
    const dates = getCycleCompletionDates(item.id);
    const count = dates.length;

    if(count < 2){
      return { insufficient: true, count, needed: 2 - count };
    }

    const allIntervals = getCycleIntervals(dates);
    const avg = allIntervals.reduce((sum, iv) => sum + iv.days, 0) / allIntervals.length;
    const level = classifyCycleLevel(avg, item.cycleDays);
    const recentIntervals = allIntervals.slice(-REPORT_CHART_MAX_BARS);

    return {
      insufficient: false,
      count,
      avg,
      level,
      lastDone: dates[dates.length - 1],
      recentIntervals,
      allIntervals
    };
  }

  function renderReportList(){
    const list = document.getElementById("reportList");
    list.innerHTML = "";

    if(cycleItems.length === 0){
      list.innerHTML = `<div class="report-list-empty">등록된 항목이 없어요.<br>주기 관리에서 항목을 먼저 추가해보세요.</div>`;
      return;
    }

    cycleItems.forEach(item => {
      const stats = getCycleReportStats(item);
      const card = document.createElement("button");
      card.type = "button";
      card.className = "report-card" + (stats.insufficient ? " insufficient" : "");

      if(stats.insufficient){
        card.innerHTML = `
          <div class="report-card-top">
            <span class="report-card-name"><span class="item-icon" aria-hidden="true">${item.icon || FALLBACK_ICON}</span>${item.name}</span>
          </div>
          <p class="report-insufficient-text">기록이 더 필요해요 (${stats.needed}회 남음)</p>
        `;
      } else {
        card.innerHTML = `
          <div class="report-card-top">
            <span class="report-card-name"><span class="item-icon" aria-hidden="true">${item.icon || FALLBACK_ICON}</span>${item.name}</span>
            <span class="report-badge badge-${stats.level}">${formatCycleBadgeLabel(stats.level, stats.avg, item.cycleDays)}</span>
          </div>
          <div class="report-card-stats">
            <div class="report-stat">
              <span class="report-stat-label">목표 주기</span>
              <span class="report-stat-value mono">${item.cycleDays}일</span>
            </div>
            <div class="report-stat">
              <span class="report-stat-label">평균 주기</span>
              <span class="report-stat-value mono">${stats.avg.toFixed(1)}일</span>
            </div>
          </div>
          <div class="report-card-meta mono">총 ${stats.count}회 완료 · 최근 ${formatShortDate(stats.lastDone)}</div>
        `;
        card.addEventListener("click", () => openReportDetail(item.id));
      }

      list.appendChild(card);
    });
  }

  function buildCycleBarChartSVG(intervals, target){
    const n = intervals.length;
    const barWidth = 32;
    const barGap = 12;
    const chartHeight = 135;
    const topPad = 22;
    const bottomPad = 22;
    const plotHeight = chartHeight - topPad - bottomPad;

    const chartWidth = Math.max(220, n * barWidth + (n - 1) * barGap + 36);

    const maxVal = Math.max(target, ...intervals.map(iv => iv.days)) * 1.18 || target * 1.18;
    const scaleY = v => plotHeight * (v / maxVal);

    const targetY = topPad + plotHeight - scaleY(target);

    let bars = "";
    intervals.forEach((iv, i) => {
      const level = classifyCycleLevel(iv.days, target);
      const color = level === "normal" ? "var(--rpt-normal)" : (level === "slow" ? "var(--rpt-slow)" : "var(--rpt-fast)");
      const textColor = level === "fast" ? "var(--rpt-fast-ink)" : "var(--ink)";
      const barH = Math.max(4, scaleY(iv.days));
      const x = 18 + i * (barWidth + barGap);
      const y = topPad + plotHeight - barH;
      const [, mm, dd] = iv.endDate.split("-");

      bars += `
        <text x="${x + barWidth/2}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="${textColor}">${iv.days}일</text>
        <rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="5" fill="${color}"></rect>
        <text x="${x + barWidth/2}" y="${topPad + plotHeight + 15}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink-soft)">${parseInt(mm,10)}/${parseInt(dd,10)}</text>
      `;
    });

    return `
      <svg viewBox="0 0 ${chartWidth} ${chartHeight}" width="${chartWidth}" height="${chartHeight}" xmlns="http://www.w3.org/2000/svg">
        <line x1="8" y1="${targetY}" x2="${chartWidth - 8}" y2="${targetY}" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4"></line>
        ${bars}
      </svg>
    `;
  }

  function renderReportHistoryList(intervals, target){
    const wrap = document.getElementById("reportDetailHistoryList");
    wrap.innerHTML = "";

    const reversed = [...intervals].reverse();

    reversed.forEach(iv => {
      const diff = iv.days - target;
      let diffText = "적정";
      let badgeStyle = "background:var(--rpt-normal-soft); color:var(--rpt-normal);";

      if(diff > 0){
        diffText = `+${diff}일`;
        badgeStyle = diff > CYCLE_DIFF_THRESHOLD
          ? "background:var(--rpt-slow-soft); color:var(--rpt-slow);"
          : "background:var(--rpt-normal-soft); color:var(--rpt-normal);";
      } else if(diff < 0){
        diffText = `${diff}일`;
        badgeStyle = diff < -CYCLE_DIFF_THRESHOLD
          ? "background:var(--rpt-fast-soft); color:var(--rpt-fast-ink);"
          : "background:var(--rpt-normal-soft); color:var(--rpt-normal);";
      }

      const row = document.createElement("div");
      row.className = "history-item mono";
      row.innerHTML = `
        <span class="history-date-range">${formatShortDate(iv.startDate)} → ${formatShortDate(iv.endDate)}</span>
        <div class="history-detail">
          <span>${iv.days}일</span>
          <span class="history-diff-badge" style="${badgeStyle}">(${diffText})</span>
        </div>
      `;
      wrap.appendChild(row);
    });
  }

  function openReportDetail(itemId){
    const item = cycleItems.find(i => i.id === itemId);
    if(!item) return;
    const stats = getCycleReportStats(item);
    if(stats.insufficient) return;

    document.getElementById("reportDetailTitle").textContent = `${item.icon || FALLBACK_ICON} ${item.name}`;
    
    document.getElementById("reportDetailSummaryBanner").textContent =
      `목표 주기 ${item.cycleDays}일 · 평균 주기 ${stats.avg.toFixed(1)}일 · 총 기록 ${stats.count}회`;

    document.getElementById("reportDetailChartWrap").innerHTML = buildCycleBarChartSVG(stats.recentIntervals, item.cycleDays);

    renderReportHistoryList(stats.recentIntervals, item.cycleDays);

    const overlay = document.getElementById("reportDetailOverlay");
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("open"));
  }

  function closeReportDetail(){
    const overlay = document.getElementById("reportDetailOverlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.hidden = true; }, 220);
  }

  document.getElementById("reportDetailCloseBtn").addEventListener("click", closeReportDetail);
  document.getElementById("reportDetailOverlay").addEventListener("click", (e) => {
    if(e.target.id === "reportDetailOverlay") closeReportDetail();
  });

  /* ---------- 드로어 제어 ---------- */
  function openDrawer(){
    const overlay = document.getElementById("drawerOverlay");
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("open"));
  }
  function closeDrawer(){
    const overlay = document.getElementById("drawerOverlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.hidden = true; }, 220);
  }

  document.getElementById("hamburgerBtn").addEventListener("click", openDrawer);
  document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
  document.getElementById("drawerOverlay").addEventListener("click", (e) => {
    if(e.target.id === "drawerOverlay") closeDrawer();
  });
  document.getElementById("drawerDashboardBtn").addEventListener("click", () => {
    closeDrawer();
    switchTab("dashboard");
  });
  document.getElementById("drawerReportBtn").addEventListener("click", () => {
    closeDrawer();
    switchTab("report");
  });

  /* =========================================================
     주기 항목 커스텀 관리 모달
     ========================================================= */
  const deleteConfirmTimers = {};

  function renderManageList(){
    const wrap = document.getElementById("manageList");
    wrap.innerHTML = "";

    if(cycleItems.length === 0){
      wrap.innerHTML = `<p class="manage-empty">등록된 항목이 없어요.</p>`;
      return;
    }

    cycleItems.forEach(item => {
      const row = document.createElement("div");
      row.className = "manage-row";
      row.innerHTML = `
        <div class="manage-row-info">
          <span class="manage-row-name"><span class="item-icon" aria-hidden="true">${item.icon || FALLBACK_ICON}</span>${item.name}</span>
          <span class="manage-row-days mono">${item.cycleDays}일마다</span>
        </div>
        <div class="row-actions">
          <button type="button" class="edit-btn" data-id="${item.id}">수정</button>
          <button type="button" class="delete-btn" data-id="${item.id}">삭제</button>
        </div>
      `;
      row.querySelector(".edit-btn").addEventListener("click", () => openEditModal(item.id));
      row.querySelector(".delete-btn").addEventListener("click", (e) => handleDeleteClick(e.currentTarget, item.id));
      wrap.appendChild(row);
    });
  }

  function handleDeleteClick(btn, id){
    if(btn.classList.contains("confirm")){
      clearTimeout(deleteConfirmTimers[id]);
      delete deleteConfirmTimers[id];
      cycleItems = cycleItems.filter(i => i.id !== id);
      saveCycleItems();
      renderManageList();
      onDataChanged();
      return;
    }
    btn.classList.add("confirm");
    btn.textContent = "한번 더 탭하면 삭제";
    deleteConfirmTimers[id] = setTimeout(() => {
      btn.classList.remove("confirm");
      btn.textContent = "삭제";
      delete deleteConfirmTimers[id];
    }, 2500);
  }

  function flashInvalid(el){
    el.classList.add("invalid");
    setTimeout(() => el.classList.remove("invalid"), 350);
  }

  let selectedNewItemIcon = ICON_OPTIONS[0];

  function renderIconPicker(){
    const wrap = document.getElementById("newItemIconPicker");
    wrap.innerHTML = "";
    ICON_OPTIONS.forEach(icon => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-option" + (icon === selectedNewItemIcon ? " selected" : "");
      btn.setAttribute("aria-pressed", icon === selectedNewItemIcon ? "true" : "false");
      btn.setAttribute("aria-label", "아이콘 " + icon + " 선택");
      btn.textContent = icon;
      btn.addEventListener("click", () => {
        selectedNewItemIcon = icon;
        renderIconPicker();
      });
      wrap.appendChild(btn);
    });
  }
  renderIconPicker();

  function handleAddItem(){
    const nameInput = document.getElementById("newItemName");
    const daysInput = document.getElementById("newItemDays");
    const daysWrap = document.getElementById("newItemDaysWrap");

    const name = nameInput.value.trim();
    const days = parseInt(daysInput.value, 10);

    if(!name){ flashInvalid(nameInput); nameInput.focus(); return; }
    if(!days || days < 1){ flashInvalid(daysWrap); daysInput.focus(); return; }

    const newItem = { id: generateId(), name, cycleDays: days, createdDate: todayStr(), icon: selectedNewItemIcon };
    cycleItems.push(newItem);
    saveCycleItems();

    nameInput.value = "";
    daysInput.value = "";
    selectedNewItemIcon = ICON_OPTIONS[0];
    renderIconPicker();

    renderManageList();
    onDataChanged();
  }

  function openManageModal(){
    const overlay = document.getElementById("modalOverlay");
    renderManageList();
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("open"));
  }
  function closeManageModal(){
    const overlay = document.getElementById("modalOverlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.hidden = true; }, 220);
  }

  document.getElementById("manageBtn").addEventListener("click", openManageModal);
  document.getElementById("modalCloseBtn").addEventListener("click", closeManageModal);
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if(e.target.id === "modalOverlay") closeManageModal();
  });
  document.getElementById("addItemBtn").addEventListener("click", handleAddItem);

  /* ---------- 항목 수정 모달 ---------- */
  let editingItemId = null;
  let selectedEditItemIcon = ICON_OPTIONS[0];

  function renderEditIconPicker(){
    const wrap = document.getElementById("editItemIconPicker");
    wrap.innerHTML = "";
    ICON_OPTIONS.forEach(icon => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "icon-option" + (icon === selectedEditItemIcon ? " selected" : "");
      btn.setAttribute("aria-pressed", icon === selectedEditItemIcon ? "true" : "false");
      btn.setAttribute("aria-label", "아이콘 " + icon + " 선택");
      btn.textContent = icon;
      btn.addEventListener("click", () => {
        selectedEditItemIcon = icon;
        renderEditIconPicker();
      });
      wrap.appendChild(btn);
    });
  }

  function openEditModal(id){
    const item = cycleItems.find(i => i.id === id);
    if(!item) return;

    editingItemId = id;
    document.getElementById("editItemName").value = item.name;
    document.getElementById("editItemDays").value = item.cycleDays;
    selectedEditItemIcon = ICON_OPTIONS.includes(item.icon) ? item.icon : ICON_OPTIONS[0];
    renderEditIconPicker();

    const overlay = document.getElementById("editModalOverlay");
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("open"));
  }

  function closeEditModal(){
    const overlay = document.getElementById("editModalOverlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.hidden = true; }, 220);
    editingItemId = null;
  }

  function handleSaveEditItem(){
    if(!editingItemId) return;
    const item = cycleItems.find(i => i.id === editingItemId);
    if(!item) return;

    const nameInput = document.getElementById("editItemName");
    const daysInput = document.getElementById("editItemDays");
    const daysWrap = document.getElementById("editItemDaysWrap");

    const name = nameInput.value.trim();
    const days = parseInt(daysInput.value, 10);

    if(!name){ flashInvalid(nameInput); nameInput.focus(); return; }
    if(!days || days < 1){ flashInvalid(daysWrap); daysInput.focus(); return; }

    item.name = name;
    item.cycleDays = days;
    item.icon = selectedEditItemIcon;

    logs.forEach(l => {
      if(l.itemType === "cycle" && l.itemKey === item.id){
        l.label = item.name;
        l.icon = item.icon;
      }
    });

    saveCycleItems();
    saveLogs();

    closeEditModal();
    renderManageList();
    onDataChanged();
  }

  document.getElementById("editModalCloseBtn").addEventListener("click", closeEditModal);
  document.getElementById("editModalOverlay").addEventListener("click", (e) => {
    if(e.target.id === "editModalOverlay") closeEditModal();
  });
  document.getElementById("saveEditItemBtn").addEventListener("click", handleSaveEditItem);

  /* =========================================================
     캘린더 탭
     ========================================================= */
  let calYear, calMonth;
  let selectedDate = todayStr();

  (function initCalendarToToday(){
    const d = new Date();
    calYear = d.getFullYear();
    calMonth = d.getMonth();
  })();

  function daysInMonth(y, mZeroBased){ return new Date(y, mZeroBased+1, 0).getDate(); }

  function renderCalendarGrid(){
    document.getElementById("calendarMonthLabel").textContent = `${calYear}년 ${calMonth+1}월`;

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const totalDays = daysInMonth(calYear, calMonth);
    const today = todayStr();

    for(let i = 0; i < firstWeekday; i++){
      const cell = document.createElement("div");
      cell.className = "day-cell outside";
      grid.appendChild(cell);
    }

    for(let d = 1; d <= totalDays; d++){
      const dateStr = ymd(calYear, calMonth, d);
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "day-cell";
      if(dateStr === today) cell.classList.add("today");
      if(dateStr === selectedDate) cell.classList.add("selected");

      const dayLogs = getDayLogs(dateStr);
      const MAX_DAY_ICONS = 3;
      const shownLogs = dayLogs.slice(0, MAX_DAY_ICONS);
      const overflowCount = dayLogs.length - shownLogs.length;
      let iconsHtml = shownLogs.map(l => `<span class="day-icon">${getLogIcon(l)}</span>`).join("");
      if(overflowCount > 0) iconsHtml += `<span class="day-icon-more">+${overflowCount}</span>`;

      cell.innerHTML = `<span class="day-num">${d}</span><span class="day-icons">${iconsHtml}</span>`;
      cell.addEventListener("click", () => selectDate(dateStr));
      grid.appendChild(cell);
    }

    const cellsSoFar = firstWeekday + totalDays;
    const targetCells = Math.ceil(cellsSoFar / 7) * 7;
    for(let i = cellsSoFar; i < targetCells; i++){
      const cell = document.createElement("div");
      cell.className = "day-cell outside";
      grid.appendChild(cell);
    }
  }

  function changeMonth(delta){
    calMonth += delta;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendarGrid();
  }
  document.getElementById("prevMonthBtn").addEventListener("click", () => changeMonth(-1));
  document.getElementById("nextMonthBtn").addEventListener("click", () => changeMonth(1));

  function selectDate(dateStr){
    selectedDate = dateStr;
    renderCalendarGrid();
    renderDayPanel(dateStr);
  }

  function formatPanelDate(dateStr){
    const [y, m, d] = dateStr.split("-").map(Number);
    const weekday = ["일","월","화","수","목","금","토"][new Date(y, m-1, d).getDay()];
    return `${m}월 ${d}일 (${weekday})`;
  }

  function renderDayPanel(dateStr){
    document.getElementById("dayPanelTitle").textContent = formatPanelDate(dateStr);
    const listEl = document.getElementById("dayLogList");
    const dayLogs = getDayLogs(dateStr);

    if(dayLogs.length === 0){
      listEl.innerHTML = `<p class="day-log-empty">이 날의 기록이 없어요.</p>`;
    } else {
      listEl.innerHTML = "";
      dayLogs.forEach(log => {
        const row = document.createElement("div");
        row.className = "day-log-item";
        row.innerHTML = `
          <div>
            <span class="log-icon" aria-hidden="true">${getLogIcon(log)}</span>
            <span class="log-label">${log.label}</span>
            <span class="log-time mono">${formatTimeDisplay(log.time)}</span>
          </div>
          <button type="button" class="log-delete-btn" aria-label="기록 삭제">✕</button>
        `;
        row.querySelector(".log-delete-btn").addEventListener("click", () => deleteLogWithUndo(log.id));
        listEl.appendChild(row);
      });
    }

    document.getElementById("addLogForm").hidden = true;
    document.getElementById("showAddLogFormBtn").hidden = false;
  }

  function populateLogItemSelect(){
    const sel = document.getElementById("logItemSelect");
    sel.innerHTML = "";

    const dailyGroup = document.createElement("optgroup");
    dailyGroup.label = "오늘 루틴";
    DAILY_ITEMS.forEach(def => {
      const opt = document.createElement("option");
      opt.value = "daily:" + def.key;
      opt.textContent = def.label;
      dailyGroup.appendChild(opt);
    });
    sel.appendChild(dailyGroup);

    if(cycleItems.length){
      const cycleGroup = document.createElement("optgroup");
      cycleGroup.label = "주기 관리";
      cycleItems.forEach(it => {
        const opt = document.createElement("option");
        opt.value = "cycle:" + it.id;
        opt.textContent = it.name;
        cycleGroup.appendChild(opt);
      });
      sel.appendChild(cycleGroup);
    }
  }

  document.getElementById("showAddLogFormBtn").addEventListener("click", () => {
    populateLogItemSelect();
    document.getElementById("logTimeInput").value = nowTimeValue();
    document.getElementById("addLogForm").hidden = false;
    document.getElementById("showAddLogFormBtn").hidden = true;
  });

  document.getElementById("confirmAddLogBtn").addEventListener("click", () => {
    const sel = document.getElementById("logItemSelect");
    const timeInput = document.getElementById("logTimeInput");
    if(!sel.value) return;
    const [itemType, itemKey] = sel.value.split(":");
    const time = timeInput.value || nowTimeValue();

    let label, icon;
    if(itemType === "daily"){
      const def = DAILY_ITEMS.find(d => d.key === itemKey);
      label = def ? def.label : itemKey;
      icon = def ? def.icon : FALLBACK_ICON;
    } else {
      const it = cycleItems.find(c => c.id === itemKey);
      label = it ? it.name : itemKey;
      icon = it ? it.icon : FALLBACK_ICON;
    }

    upsertLog(itemType, itemKey, label, selectedDate, time, icon);
    onDataChanged();
  });

  /* ---------- 로그 삭제 (실행취소 스낵바) ---------- */
  let pendingDeleteTimer = null;
  let pendingDeleteLog = null;

  function showSnackbar(message, onUndo){
    clearTimeout(pendingDeleteTimer);
    const el = document.getElementById("snackbar");
    el.querySelector(".snackbar-msg").textContent = message;
    const undoBtn = el.querySelector(".snackbar-undo");
    undoBtn.onclick = () => {
      clearTimeout(pendingDeleteTimer);
      el.classList.remove("show");
      if(onUndo) onUndo();
    };
    el.classList.add("show");
    pendingDeleteTimer = setTimeout(() => {
      el.classList.remove("show");
      pendingDeleteLog = null;
    }, 4000);
  }

  function deleteLogWithUndo(logId){
    const log = logs.find(l => l.id === logId);
    if(!log) return;
    pendingDeleteLog = log;
    removeLogById(logId);
    onDataChanged();
    showSnackbar(`'${log.label}' 기록을 삭제했어요`, () => {
      if(pendingDeleteLog){
        logs.push(pendingDeleteLog);
        saveLogs();
        pendingDeleteLog = null;
        onDataChanged();
      }
    });
  }

  /* =========================================================
     탭 전환 (대시보드 / 캘린더 / 리포트)
     ========================================================= */
  const dashboardView = document.getElementById("dashboardView");
  const calendarView = document.getElementById("calendarView");
  const reportView = document.getElementById("reportView");
  const tabDashboardBtn = document.getElementById("tabDashboardBtn");
  const tabCalendarBtn = document.getElementById("tabCalendarBtn");
  const tabReportBtn = document.getElementById("tabReportBtn");

  function switchTab(tab){
    dashboardView.hidden = true;
    calendarView.hidden = true;
    reportView.hidden = true;

    tabDashboardBtn.classList.remove("active");
    tabCalendarBtn.classList.remove("active");
    tabReportBtn.classList.remove("active");

    if(tab === "calendar"){
      calendarView.hidden = false;
      tabCalendarBtn.classList.add("active");
      renderCalendarGrid();
      renderDayPanel(selectedDate);
    } else if(tab === "report"){
      reportView.hidden = false;
      tabReportBtn.classList.add("active");
      renderReportList();
    } else {
      dashboardView.hidden = false;
      tabDashboardBtn.classList.add("active");
      renderCycles();
    }
  }

  tabDashboardBtn.addEventListener("click", () => switchTab("dashboard"));
  tabCalendarBtn.addEventListener("click", () => switchTab("calendar"));
  tabReportBtn.addEventListener("click", () => switchTab("report"));

  /* =========================================================
     통합 리렌더 + 자정/포그라운드 복귀 감지
     ========================================================= */
  function onDataChanged(){
    renderDaily();
    renderCycles();
    if(!calendarView.hidden){
      renderCalendarGrid();
      renderDayPanel(selectedDate);
    }
    if(!reportView.hidden){
      renderReportList();
    }
  }

  function renderAll(){
    renderHeader();
    renderDaily();
    renderCycles();
  }

  let lastKnownDate = todayStr();
  function checkDateChange(){
    const today = todayStr();
    if(today !== lastKnownDate){
      lastKnownDate = today;
      onDataChanged();
    }
    renderHeader();
  }
  setInterval(checkDateChange, 30 * 1000);
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") checkDateChange();
  });

  renderAll();
})();
</script>
</body>
</html>
